# Tests, builds and publishes the player to GitHub Pages on every push to master.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Allows running the workflow manually from the Actions tab.
  workflow_dispatch:

# Only what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an older one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
